<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>デイリー授業ボード</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .class-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>デイリー授業ボード</h1>
        <p><a href="/">トップページへ</a></p>

        <div class="live-info-container">
            <div class="date-nav">
                <button id="prev-day-btn">&lt; 前日</button>
                <h2 id="displayed-date"></h2>
                <button id="next-day-btn">翌日 &gt;</button>
            </div>
            <div class="class-nav">
                <button id="prev-class-btn">&lt; 前のコマ</button>
                <h3 id="current-class-info"></h3>
                <button id="next-class-btn">次のコマ &gt;</button>
            </div>
            <div class="class-controls">
                <button id="refresh-btn">表示中のコマを更新</button>
                <button id="add-transfer-btn">＋ 振替生徒を追加</button>
            </div>
        </div>

        <div id="attendee-list-container"></div>
    </div>

    <div id="transfer-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>振替生徒の追加</h2>
            <p><strong>授業:</strong> <span id="transfer-class-info"></span></p>
            <div class="form-container">
                <div class="student-search">
                    <input type="text" id="student-search-input" placeholder="生徒の名前またはIDで検索">
                    <button type="button" id="student-search-btn">検索</button>
                </div>
                <div id="student-search-results" class="search-results-list">
                    </div>
            </div>
            <p id="transfer-message" class="message"></p>
        </div>
    </div>

    <script src="live-dashboard.js"></script>
</body>
</html>
